name: Train Lio model
# Fine-tunes Qwen2.5-1.5B-Instruct into Lio on CPU (3 rounds of ~5 h,
# resumed from artifacts), merges it and converts it to a LiteRT-LM file
# for phones. "base-only" skips training to test the conversion path.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: train = fine-tune then convert; base-only = convert the untouched base model
        type: choice
        options: [train, base-only]
        default: train
permissions:
  contents: write

jobs:
  round1:
    if: inputs.mode == 'train'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "1" }
  round2:
    needs: round1
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "2", prev: "1" }
  round3:
    needs: round2
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "3", prev: "2" }

  package:
    needs: round3
    if: always() && (inputs.mode == 'base-only' || needs.round3.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HOME: /mnt/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: More memory (swap on /mnt) and work dirs
        run: |
          sudo mkdir -p /mnt/lio /mnt/hf && sudo chown -R "$USER" /mnt/lio /mnt/hf
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h; df -h / /mnt
      - name: Install conversion deps
        run: |
          pip install --quiet "torch<2.14" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet litert-torch "transformers>=4.45" "peft>=0.13" accelerate safetensors
      - name: Fetch trained state
        if: inputs.mode == 'train'
        uses: actions/download-artifact@v4
        with:
          name: lio-state-3
          path: /mnt/lio/state
      - name: Merge LoRA (or take the base model)
        run: |
          if [ "${{ inputs.mode }}" = "train" ]; then
            cat /mnt/lio/state/progress.json | head -c 400; echo
            python3 tool/lio_train/train_lora.py --data /dev/null --state /mnt/lio/state --merge /mnt/lio/merged
          else
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen2.5-1.5B-Instruct', local_dir='/mnt/lio/merged')"
          fi
          ls -la /mnt/lio/merged
      - name: Convert to LiteRT-LM
        run: python3 tool/lio_train/convert.py --ckpt /mnt/lio/merged --out /mnt/lio/out --name lio-qwen2.5-1.5b-${{ inputs.mode }}
      - name: Checksums
        run: cd /mnt/lio/out && ls -la && sha256sum *.litertlm | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lio-model-${{ inputs.mode }}
          path: /mnt/lio/out
          retention-days: 30
      - name: Publish to the lio-model release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lio-model -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create lio-model -R "$GITHUB_REPOSITORY" --prerelease --title "Lio on-device model" \
              --notes "Lio, Dayly's companion: Qwen2.5-1.5B-Instruct (Apache-2.0) fine-tuned for everyday planning, converted to LiteRT-LM."
          gh release upload lio-model /mnt/lio/out/*.litertlm /mnt/lio/out/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
