name: Train Lio model
# Fine-tunes Qwen2.5-1.5B-Instruct into Lio on CPU: 3 rounds of ~5 h,
# each resuming from the previous round's artifact. When it finishes, run
# "Convert Lio model" with this run's ID to merge and convert it.
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  round1:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "1" }
  round2:
    needs: round1
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "2", prev: "1" }
  round3:
    needs: round2
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "3", prev: "2" }

