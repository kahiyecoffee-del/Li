name: Train Lio model
# Fine-tunes Qwen2.5-1.5B-Instruct into Lio on CPU: 3 rounds of ~5 h,
# each resuming from the previous round's artifact. When it finishes, run
# "Convert Lio model" with this run's ID to merge and convert it.
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Continue from round 1 of this earlier run (empty = start fresh)
        default: ""
permissions:
  contents: write
  actions: read

jobs:
  round1:
    if: inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "1" }
  round2:
    needs: round1
    if: always() && (needs.round1.result == 'success' || needs.round1.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "2", prev: "1", prev_run_id: "${{ inputs.resume_run_id }}" }
  round3:
    needs: round2
    if: always() && needs.round2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lio-train-round
        with: { round: "3", prev: "2" }

