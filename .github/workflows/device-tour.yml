name: Device tour
# Runs the app on an Android emulator and an iPhone simulator, takes
# screenshots of the main screens and publishes them as a pre-release, so the
# app can be checked without a physical phone.
on:
  workflow_dispatch:
  push:
    branches: [claude/lifeos-mvp]
    paths: [integration_test/**, test_driver/**, ios/**, pubspec.yaml, .github/workflows/device-tour.yml]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOT_DIR: android
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            flutter drive --driver test_driver/integration_test.dart --target integration_test/launch_test.dart 2>&1 | tee android-launch.log
            flutter drive --driver test_driver/integration_test.dart --target integration_test/tour_test.dart 2>&1 | tee android-tour.log
            grep -q "All tests passed" android-launch.log && grep -q "All tests passed" android-tour.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-android
          path: |
            screenshots/
            android-*.log

  ios:
    # Xcode 26 SDK: needed by current plugins (connectivity_plus) and by App Store uploads.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Build for the simulator (with log)
        timeout-minutes: 50
        run: |
          set -o pipefail
          flutter build ios --simulator --debug -v 2>&1 | tee ios-build-full.log | grep -E "error:|warning: .*DaylyWidget|BUILD|Xcode build done|Failed" || true
          test -d build/ios/iphonesimulator/Runner.app
          ls build/ios/iphonesimulator/Runner.app/PlugIns || echo "no PlugIns folder"
      - name: Keep the important build lines
        if: always()
        run: |
          grep -nE "error:|Cycle in dependencies|CodeSign|DaylyWidget|Command .* failed|Xcode build done|\*\* BUILD" ios-build-full.log | tail -n 200 > ios-build-errors.log || true
          tail -n 120 ios-build-full.log > ios-build-tail.log || true
          rm -f ios-build-full.log
      - name: Boot an iPhone simulator
        run: |
          xcrun simctl list devices available | grep -i iphone | head -20
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone') and 'SE' not in x['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Run on simulator
        env:
          SHOT_DIR: ios
        run: |
          set -o pipefail
          flutter drive -d "$UDID" --driver test_driver/integration_test.dart --target integration_test/launch_test.dart 2>&1 | tee ios-launch.log || echo "launch test failed" >> ios-failed.txt
          flutter drive -d "$UDID" --driver test_driver/integration_test.dart --target integration_test/tour_test.dart 2>&1 | tee ios-tour.log || echo "tour test failed" >> ios-failed.txt
          test ! -f ios-failed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-ios
          path: |
            screenshots/
            ios-*.log

  publish:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: out
      - name: Publish screenshots as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p flat
          for f in $(find out -name '*.png'); do cp "$f" "flat/$(basename $(dirname $f))-$(basename $f)"; done
          for f in $(find out -name '*.log'); do tail -n 300 "$f" > "flat/$(basename $f)"; done
          ls -la flat
          gh release create "device-tour-${{ github.run_number }}" flat/* -R "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" --prerelease --title "Device tour ${{ github.run_number }}" \
            --notes "Android: ${{ needs.android.result }}, iOS: ${{ needs.ios.result }}"
