name: Model probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List on-device LLM files (MediaPipe .task / .litertlm) with sizes
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              with urllib.request.urlopen(u, timeout=60) as r: return json.load(r)
          repos = [m['id'] for m in get('https://huggingface.co/api/models?author=litert-community&limit=500')]
          print('repos:', len(repos))
          for repo in sorted(repos):
              try:
                  info = get(f'https://huggingface.co/api/models/{repo}')
                  tree = get(f'https://huggingface.co/api/models/{repo}/tree/main?recursive=1')
              except Exception as e:
                  print('ERR', repo, e); continue
              gated = info.get('gated')
              lic = (info.get('cardData') or {}).get('license')
              for f in tree:
                  p = f.get('path','')
                  if p.endswith('.task') or p.endswith('.litertlm'):
                      mb = (f.get('lfs') or {}).get('size', f.get('size', 0)) / 1e6
                      print(f'{mb:8.0f} MB  gated={gated!s:5}  lic={lic}  {repo}/{p}')
          PY
