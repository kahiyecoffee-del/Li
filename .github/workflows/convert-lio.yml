name: Convert Lio model
# Merges a finished training run (or takes the base model) and converts it
# to LiteRT-LM. Separate from training so the conversion can be fixed and
# re-run without retraining.
on:
  workflow_dispatch:
    inputs:
      train_run_id:
        description: Run ID of a finished "Train Lio model" run (empty = convert the untouched base model)
        default: ""
      state_artifact:
        description: Training state artifact to use from that run
        default: lio-state-3
      quantize:
        description: dynamic_int8 (larger, a bit better) or dynamic_int4_block32 (about half the size)
        type: choice
        options: [dynamic_int8, dynamic_int4_block32]
        default: dynamic_int8
permissions:
  contents: write
  actions: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HOME: /mnt/hf
      TAG: ${{ inputs.train_run_id == '' && 'base' || 'trained' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: More memory (swap on /mnt) and work dirs
        run: |
          sudo mkdir -p /mnt/lio /mnt/hf && sudo chown -R "$USER" /mnt/lio /mnt/hf
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h; df -h / /mnt
      - name: Install conversion deps
        run: |
          pip install --quiet "torch<2.14" --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet litert-torch tensorflow-cpu "transformers>=4.45" "peft>=0.13" accelerate safetensors
      - name: Fetch trained state
        if: inputs.train_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.state_artifact }}
          path: /mnt/lio/state
          run-id: ${{ inputs.train_run_id }}
          github-token: ${{ github.token }}
      - name: Merge LoRA (or take the base model)
        run: |
          if [ -n "${{ inputs.train_run_id }}" ]; then
            head -c 600 /mnt/lio/state/progress.json; echo
            python3 tool/lio_train/train_lora.py --data /dev/null --state /mnt/lio/state --merge /mnt/lio/merged
          else
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen2.5-1.5B-Instruct', local_dir='/mnt/lio/merged')"
          fi
          ls -la /mnt/lio/merged
      - name: Convert to LiteRT-LM
        run: python3 tool/lio_train/convert.py --ckpt /mnt/lio/merged --out /mnt/lio/out --name lio-qwen2.5-1.5b-$TAG --quantize ${{ inputs.quantize }}
      - name: Checksums
        run: cd /mnt/lio/out && ls -la && sha256sum *.litertlm | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lio-model-${{ env.TAG }}
          path: /mnt/lio/out
          retention-days: 30
      - name: Publish to the lio-model release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lio-model -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create lio-model -R "$GITHUB_REPOSITORY" --prerelease --title "Lio on-device model" \
              --notes "Lio, Dayly's companion: Qwen2.5-1.5B-Instruct (Apache-2.0) fine-tuned for everyday planning, converted to LiteRT-LM."
          gh release upload lio-model /mnt/lio/out/*.litertlm /mnt/lio/out/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
