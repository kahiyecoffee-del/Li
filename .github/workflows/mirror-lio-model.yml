name: Mirror Lio model (Gemma 3 1B)
# One-time: copies Lio's on-device model from Hugging Face (where Gemma needs
# a signed-in, license-accepted account) into a public GitHub release, so
# users download it without any account. Needs the HF_TOKEN secret.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  REPO_FILE: litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q4_block32_ekv1280.task
  ASSET: gemma3-1b-it-q4-block32-ekv1280.task
  TAG: lio-model-v1
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN secret first (Settings → Secrets → Actions)."; exit 1; fi
          curl -fL --retry 5 -H "Authorization: Bearer $HF_TOKEN" -o "$ASSET" "https://huggingface.co/$REPO_FILE"
          ls -l "$ASSET"
          sha256sum "$ASSET" | tee "$ASSET.sha256"
      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Lio's on-device model for Dayly: Gemma 3 1B IT (int4, block32, 1280-token context), MediaPipe `.task`.

          Gemma is provided under and subject to the Gemma Terms of Use found at https://ai.google.dev/gemma/terms
          and its use is restricted by the Gemma Prohibited Use Policy: https://ai.google.dev/gemma/prohibited_use_policy
          Original file: https://huggingface.co/litert-community/Gemma3-1B-IT (unmodified copy).
          NOTES
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Lio model v1 (Gemma 3 1B)" --notes-file notes.md --prerelease
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" -R "$GITHUB_REPOSITORY" --clobber
          echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
