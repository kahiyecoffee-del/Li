name: iOS TestFlight

# Builds a signed release and uploads it to TestFlight. Run it from the
# Actions tab (works in the GitHub mobile app too). Needs these secrets:
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key),
# APPLE_TEAM_ID, MATCH_PASSWORD, MATCH_GIT_TOKEN (access to the private
# certificates repo). See docs/IOS_TESTFLIGHT.md.
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What to test in this build"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
      MATCH_GIT_URL: https://github.com/${{ github.repository_owner }}/dayly-certs.git
      CHANGELOG: ${{ inputs.changelog }}
    steps:
      - name: Check secrets are set
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID MATCH_PASSWORD MATCH_GIT_TOKEN; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Flutter release build (unsigned; fastlane signs it)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Install fastlane
        run: command -v fastlane || gem install fastlane --no-document
      - name: Sign and upload to TestFlight
        working-directory: ios
        run: fastlane beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-and-logs
          path: |
            build/ipa/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
