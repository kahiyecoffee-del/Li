name: Android test APK

# Builds an installable APK and publishes it as a GitHub pre-release so it
# can be downloaded straight to a phone. The build has no Firebase config, so
# the app runs in on-device mode (no cloud sync / online AI / purchases).
on:
  push:
    branches: [claude/lifeos-mvp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Build APK (arm64, release mode, signed with the debug key)
        run: flutter build apk --release --target-platform android-arm64
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk Dayly-test-${{ github.run_number }}.apk
      # Always keep the APK as a run artifact (Actions → run → Artifacts),
      # even if publishing the release below is refused.
      - uses: actions/upload-artifact@v4
        with:
          name: Dayly-test-${{ github.run_number }}
          path: Dayly-test-${{ github.run_number }}.apk
          retention-days: 30
      - name: Publish as a pre-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          gh release create "test-build-$N" "Dayly-test-$N.apk" -R "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Dayly test build $N" \
            --notes "Test build from commit $GITHUB_SHA. Install on an Android phone (arm64): open the APK and allow \"install unknown apps\". Runs in on-device mode until Firebase is configured."
